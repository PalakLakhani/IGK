[build]
  command = "yarn build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables needed (set these in Netlify Dashboard):
# - MONGO_URL
# - CLOUDINARY_CLOUD_NAME
# - CLOUDINARY_API_KEY
# - CLOUDINARY_API_SECRET
# - NEXT_PUBLIC_UMAMI_WEBSITE_ID
# - NEXT_PUBLIC_UMAMI_URL
# - NEXT_PUBLIC_BASE_URL
# - ADMIN_PASSWORD
